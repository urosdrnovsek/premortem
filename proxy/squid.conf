# Minimal allow-list forward proxy for the claude2 agent sandbox.
#
# This does NOT decrypt HTTPS traffic (no ssl-bump configured) — for a
# CONNECT (HTTPS) request, Squid only ever sees the destination hostname,
# never the encrypted content. That's deliberate: enough to allow-list by
# destination, without needing to install a trusted CA cert in the agent
# container or inspect its actual traffic.
#
# IMPORTANT — read this on first run:
# This list covers the known essentials (Anthropic's API, PyPI, npm's
# registry). Claude Code may also reach a few auxiliary hosts not listed
# here yet (telemetry, update checks, OAuth login endpoints). Check
# /var/log/squid/access.log inside this container for TCP_DENIED entries
# after your first real run, and add any legitimate ones below deliberately,
# one at a time — don't widen this to a wildcard out of convenience.

http_port 3128

# Bypass the container's own /etc/resolv.conf for DNS lookups. When this
# proxy is attached to two networks (the internal agent network + the real
# one), Podman injects the internal network's own local DNS helper into
# resolv.conf alongside the real DNS servers, in a non-deterministic order.
# When that entry lands first, it answers "no such host" for every public
# domain (it only knows other containers' names) and Squid's resolver
# treats that as final — an intermittent, hard-to-reproduce failure.
# Naming real DNS servers here sidesteps resolv.conf entirely.
dns_nameservers 9.9.9.9 149.112.112.112

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# --- allow-listed destinations ---
acl allowed_dsts dstdomain .anthropic.com
acl allowed_dsts dstdomain claude.ai
acl allowed_dsts dstdomain claude.com
acl allowed_dsts dstdomain platform.claude.com
acl allowed_dsts dstdomain pypi.org
acl allowed_dsts dstdomain files.pythonhosted.org
acl allowed_dsts dstdomain registry.npmjs.org

# --- access rules, evaluated top to bottom ---
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_dsts
http_access deny all

# No disk cache — this proxy only relays/allow-lists, it doesn't need to
# store anything.
cache deny all

access_log /var/log/squid/access.log
