name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # weasyprint needs Pango/Cairo at import time; without them the PDF smoke
      # test in tests/test_report.py skips instead of exercising the real output path.
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf2.0-0 libffi-dev  # same list as install.sh

      - run: pip install -r requirements.txt

      - run: pytest -q
