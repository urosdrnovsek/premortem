name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # weasyprint (PDF rendering) is imported lazily in report/render.py and
      # isn't exercised by the test suite, so no system Pango/Cairo libraries
      # are needed here - a plain pip install is enough to run pytest.
      - run: pip install -r requirements.txt

      - run: pytest -q
